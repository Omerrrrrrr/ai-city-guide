name: Piri
options:
  bundleIdPrefix: com.piriapp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.40.1
targets:
  Piri:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    dependencies:
      - package: Sentry
        product: Sentry
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait-only (see above) with no full-screen opt-out otherwise
        # trips Apple's own archive validator: "All interface orientations
        # must be supported unless the app requires full screen" —
        # confirmed via a real `xcodebuild archive` run. iPad (this app's
        # TARGETED_DEVICE_FAMILY includes it) defaults to expecting
        # multi-orientation/multitasking support unless this is set.
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: "Piri uses your location to show nearby places and give you city-specific recommendations."
        NSCameraUsageDescription: "Piri uses your camera to identify places and give you personalized explanations."
        NSPhotoLibraryAddUsageDescription: "Piri can save trip photos to your library."
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # Standard HTTPS/TLS only, no proprietary/non-exempt encryption --
        # declaring this here answers Apple's export-compliance question
        # automatically at each submission instead of it being asked in
        # App Store Connect every time.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Piri.entitlements
      properties:
        # Literal build-setting reference, substituted by Xcode at
        # codesign time -- not a plain value, since Debug and Release
        # genuinely need different values here (see PIRI_APS_ENVIRONMENT
        # below). A push notification sent against a Release/App-Store
        # build with this hardcoded to "development" silently fails to
        # deliver -- APNs' development and production environments are
        # entirely separate services with separate device tokens.
        aps-environment: $(PIRI_APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piriapp.piri
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          PIRI_APS_ENVIRONMENT: development
        Release:
          PIRI_APS_ENVIRONMENT: production
  PiriTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: Piri
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # Hosted (not standalone) unit tests: the test bundle loads into the
        # Piri.app process, so `Bundle.main` inside tests resolves to the
        # actual app bundle — needed for `String(localized:)` to find
        # Localizable.xcstrings at all, rather than silently falling back
        # to returning the raw key (which is invisible unless you assert on
        # the resolved string, as the plural tests do).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Piri.app/Piri"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Drives the simulator via XCTest's own automation (testmanagerd), not
  # host-level Accessibility APIs — the only way to actually tap through
  # the app from this environment, which has no Accessibility permission
  # for AppleScript/System Events UI scripting. Kept in its own scheme
  # (not bundled into the `Piri` scheme's regular `test` action) since
  # full-app UI tests are much slower than the plain unit tests and aren't
  # meant to run on every build/test cycle — only when actually verifying
  # a UI flow end-to-end.
  PiriUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
    dependencies:
      - target: Piri
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Piri
schemes:
  Piri:
    build:
      targets:
        Piri: all
        PiriTests: [test]
    test:
      targets:
        - PiriTests
  PiriUITests:
    build:
      targets:
        Piri: all
        PiriUITests: [test]
    test:
      targets:
        - PiriUITests
