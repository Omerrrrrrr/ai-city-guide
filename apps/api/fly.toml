app = "piri-api"
primary_region = "fra"

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 1: the app has been live on the App Store since 2026-09-18, and with 0 the
  # first request after idle waits a few seconds for the machine to start
  # (sign-in, photos, AI answers). One always-on shared-cpu-1x/512MB machine
  # is the cost of avoiding that. Nothing in the API runs on timers, so this
  # is purely about cold starts.
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
