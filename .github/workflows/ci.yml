name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

  ios:
    # macos-14's newest available Xcode (16.2) predates the iOS 26 SDK, and
    # Theme.swift uses the iOS 26 Liquid Glass `glassEffect` API (guarded by
    # `#available` at runtime, but the symbol still has to exist in the SDK
    # at compile time regardless) -- macos-15 is needed for an Xcode new
    # enough to have it. Confirmed via the actual failed run's log
    # (`gh run view --log-failed`): "value of type 'Self' has no member
    # 'glassEffect'" against Xcode 16.2, not a signing/destination issue.
    runs-on: macos-15
    defaults:
      run:
        working-directory: native/Piri
    steps:
      - uses: actions/checkout@v4
      - name: Select latest available Xcode
        # deploymentTarget is iOS 18.0 (project.yml), which needs an iOS 18
        # SDK -- macos-14 runner images ship several Xcode versions side by
        # side under /Applications, and /Applications/Xcode.app's default
        # symlink isn't guaranteed to point at one new enough. Pick whichever
        # installed Xcode is newest instead of assuming the default.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test
        # `PiriTests` (PluralsTests, TripsStoreTests, CategoriesTests,
        # PlaceHoursTests, PlaceFiltersTests) already exist and are already
        # wired into the `Piri` scheme's Test action -- this workflow just
        # never actually ran them, only compiled the app
        # (`xcodebuild build` against the generic destination below, which
        # can't run anything at all). `xcodebuild test` needs a concrete,
        # booted-capable simulator (the generic destination is build-only),
        # resolved here rather than hardcoded by name -- a name pinned today
        # can vanish from a future runner image's simulator set entirely.
        run: |
          DESTINATION_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for device in devices:
                  if 'iPhone' in device['name']:
                      print(device['name'])
                      sys.exit(0)
          ")
          if [ -z "$DESTINATION_NAME" ]; then
            echo "No available iPhone simulator found on this runner" >&2
            exit 1
          fi
          echo "Testing against: $DESTINATION_NAME"
          xcodebuild test \
            -project Piri.xcodeproj \
            -scheme Piri \
            -destination "platform=iOS Simulator,name=$DESTINATION_NAME" \
            CODE_SIGNING_ALLOWED=NO
