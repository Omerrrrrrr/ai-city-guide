name: Piri
options:
  bundleIdPrefix: com.piriapp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    # Ömer's real paid Individual membership (Apple Developer Program),
    # active 2026-08-25 — was "Personal Team" (no team ID at all, real-
    # device signing for Sign in with Apple/Push Notifications impossible)
    # until then. `CODE_SIGN_STYLE: Automatic` still handles provisioning
    # profile creation/renewal itself; this just points it at the right
    # team instead of leaving Xcode to guess between this and the
    # unrelated "Granni Tech AS" team on the same Apple ID.
    DEVELOPMENT_TEAM: W6U9VQR5RQ
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.40.1
targets:
  Piri:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    dependencies:
      - package: Sentry
        product: Sentry
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait-only (see above) with no full-screen opt-out otherwise
        # trips Apple's own archive validator: "All interface orientations
        # must be supported unless the app requires full screen" —
        # confirmed via a real `xcodebuild archive` run. iPad (this app's
        # TARGETED_DEVICE_FAMILY includes it) defaults to expecting
        # multi-orientation/multitasking support unless this is set.
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: "Piri uses your location to show nearby places and give you city-specific recommendations."
        NSCameraUsageDescription: "Piri uses your camera to identify places and give you personalized explanations."
        NSPhotoLibraryAddUsageDescription: "Piri can save trip photos to your library."
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "5"
        # `APIConfig.baseURL` reads this if present, but only on a real
        # device -- the Simulator (shares the Mac's own network namespace)
        # ignores this key entirely and always uses `127.0.0.1:4000`
        # (see `APIConfig.swift`), since a real device needs the Mac's
        # actual LAN IP instead: to the phone, "127.0.0.1" just means
        # itself. Only meaningful for a Debug real-device build on this
        # same Wi-Fi network; Release ignores this key entirely
        # (hardcoded to api.getpiri.com).
        PiriAPIBaseURL: $(PIRI_API_BASE_URL)
        # Scoped ATS exception for exactly that one private LAN IP --
        # iOS blocks plain HTTP by default on a real device (Simulator's
        # 127.0.0.1 is exempt automatically, a LAN IP isn't). Deliberately
        # not a blanket NSAllowsArbitraryLoads: this only exempts the one
        # LAN IP above, inert for Release (which never points at it) and
        # not the kind of global HTTP allowance App Review flags.
        NSAppTransportSecurity:
          NSExceptionDomains:
            10.40.29.11:
              NSExceptionAllowsInsecureHTTPLoads: true
        # Standard HTTPS/TLS only, no proprietary/non-exempt encryption --
        # declaring this here answers Apple's export-compliance question
        # automatically at each submission instead of it being asked in
        # App Store Connect every time.
        ITSAppUsesNonExemptEncryption: false
        # `PlaceDirections.canOpenURL` needs each external maps app's
        # scheme declared here or it always reports `false` (even when the
        # app is installed) — without this, picking Google or Yandex as
        # the preferred maps app in Settings would silently always fall
        # back to the web URL, never actually opening the installed app.
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - yandexmaps
    entitlements:
      path: Piri.entitlements
      properties:
        # Literal build-setting reference, substituted by Xcode at
        # codesign time -- not a plain value, since Debug and Release
        # genuinely need different values here (see PIRI_APS_ENVIRONMENT
        # below). A push notification sent against a Release/App-Store
        # build with this hardcoded to "development" silently fails to
        # deliver -- APNs' development and production environments are
        # entirely separate services with separate device tokens.
        aps-environment: $(PIRI_APS_ENVIRONMENT)
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piriapp.piri
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PIRI_APS_ENVIRONMENT: development
          # Ömer's Mac's current LAN IP -- update this if it changes
          # (different network, DHCP renewal) or a real-device Debug
          # build will fail to reach the local dev server with the exact
          # "Kunne ikke koble til tjeneren" symptom this was added to fix.
          PIRI_API_BASE_URL: http://10.40.29.11:4000
        Release:
          PIRI_APS_ENVIRONMENT: production
    postCompileScripts:
      # SPM-distributed Sentry.framework doesn't get its own dSYM copied
      # into an archive automatically (a known Sentry-Cocoa/SPM gap,
      # confirmed live 2026-08-25: `xcodebuild -exportArchive` warned
      # "did not include a dSYM for the Sentry.framework"). Uploading
      # debug files directly to Sentry via sentry-cli sidesteps needing
      # the archive to have it at all -- App Store Connect's own symbol
      # server is irrelevant once Sentry has its own copy. Auth lives in
      # `.sentryclirc` (gitignored, one per machine), not here.
      - name: Upload debug symbols to Sentry
        script: |
          if which sentry-cli >/dev/null; then
            sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" "$BUILT_PRODUCTS_DIR" || echo "warning: sentry-cli debug-files upload failed"
          else
            echo "warning: sentry-cli not installed, skipping Sentry dSYM upload (brew install getsentry/tools/sentry-cli)"
          fi
  PiriTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: Piri
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        # Hosted (not standalone) unit tests: the test bundle loads into the
        # Piri.app process, so `Bundle.main` inside tests resolves to the
        # actual app bundle — needed for `String(localized:)` to find
        # Localizable.xcstrings at all, rather than silently falling back
        # to returning the raw key (which is invisible unless you assert on
        # the resolved string, as the plural tests do).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Piri.app/Piri"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Drives the simulator via XCTest's own automation (testmanagerd), not
  # host-level Accessibility APIs — the only way to actually tap through
  # the app from this environment, which has no Accessibility permission
  # for AppleScript/System Events UI scripting. Kept in its own scheme
  # (not bundled into the `Piri` scheme's regular `test` action) since
  # full-app UI tests are much slower than the plain unit tests and aren't
  # meant to run on every build/test cycle — only when actually verifying
  # a UI flow end-to-end.
  PiriUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
    dependencies:
      - target: Piri
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Piri
schemes:
  Piri:
    build:
      targets:
        Piri: all
        PiriTests: [test]
    run:
      # Without this, the app talks to real StoreKit -- which returns no
      # products in Simulator for subscriptions still in "Prepare for
      # Submission" on App Store Connect, so every PaywallScreen price
      # button silently showed "--" instead of a price. Confirmed via a
      # live screenshot 2026-08-25.
      storeKitConfiguration: Piri.storekit
    test:
      targets:
        - PiriTests
  PiriUITests:
    build:
      targets:
        Piri: all
        PiriUITests: [test]
    test:
      targets:
        - PiriUITests
